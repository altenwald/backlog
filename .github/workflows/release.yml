name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build macOS Universal Bundle
        run: |
          make bundle

      - name: Sign macOS App
        if: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # 1. Create temporary isolated keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # 2. Decode and import Developer ID certificate
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "" build.keychain
          rm certificate.p12

          # 3. Sign inner binary and app bundle with Hardened Runtime and Timestamp
          SIGN="Developer ID Application: Altenwald (9B5SR4AYZP)"
          codesign --force --timestamp --options runtime \
            --entitlements build/macos/entitlements.plist \
            --sign "$SIGN" \
            bin/Backlog.app/Contents/MacOS/backlog
          codesign --force --timestamp --options runtime \
            --entitlements build/macos/entitlements.plist \
            --sign "$SIGN" \
            bin/Backlog.app

      - name: Create & Sign DMG
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          mkdir -p dmg_staging dist
          cp -R bin/Backlog.app dmg_staging/

          # Create DMG with symlink to /Applications
          hdiutil create \
            -volname "Backlog" \
            -srcfolder dmg_staging \
            -ov -format UDRW \
            backlog-temp.dmg
          rm -rf dmg_staging

          DEVICE=$(hdiutil attach -readwrite -noverify -noautoopen backlog-temp.dmg | egrep '^/dev/' | sed 1q | awk '{print $1}')
          cd /Volumes/Backlog && ln -s /Applications && cd -
          hdiutil detach "$DEVICE"

          DMG="dist/backlog-${TAG}-darwin-universal.dmg"
          hdiutil convert backlog-temp.dmg \
            -format UDZO \
            -o "$DMG"
          rm backlog-temp.dmg

          # Sign the DMG if certificate secret is available
          if [ -n "${{ secrets.MACOS_CERTIFICATE_P12 }}" ]; then
            codesign --force --timestamp \
              --sign "Developer ID Application: Altenwald (9B5SR4AYZP)" \
              "$DMG"
          fi

      - name: Notarize and Staple DMG
        if: ${{ secrets.MACOS_NOTARY_KEY != '' }}
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          DMG="dist/backlog-${TAG}-darwin-universal.dmg"

          echo "$NOTARY_KEY" | base64 --decode > notary_key.p8

          xcrun notarytool submit "$DMG" \
            --key notary_key.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait

          xcrun stapler staple "$DMG"
          rm notary_key.p8
          security delete-keychain build.keychain || true

          # Attempt to staple the .app bundle directly so the zip also includes the ticket
          xcrun stapler staple bin/Backlog.app || true

      - name: Package macOS artifacts
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          mkdir -p dist
          # Archive the Backlog.app bundle
          (cd bin && zip -r -y "../dist/backlog-${TAG}-darwin-universal.zip" "Backlog.app")
          # Archive the standalone universal CLI binary
          tar -czvf "dist/backlog-${TAG}-darwin-universal.tar.gz" -C bin backlog

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*
          retention-days: 1

  build-linux:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install Linux dependencies for Fyne
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev

      - name: Build Linux binary
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X github.com/altenwald/backlog/pkg/version.Version=${TAG} -X github.com/altenwald/backlog/pkg/version.GitCommit=${COMMIT} -X github.com/altenwald/backlog/pkg/version.BuildDate=${BUILD_DATE}"
          mkdir -p bin dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/backlog ./cmd/backlog
          tar -czvf "dist/backlog-${TAG}-linux-amd64.tar.gz" -C bin backlog

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*
          retention-days: 1

  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build Windows binary
        shell: bash
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X github.com/altenwald/backlog/pkg/version.Version=${TAG} -X github.com/altenwald/backlog/pkg/version.GitCommit=${COMMIT} -X github.com/altenwald/backlog/pkg/version.BuildDate=${BUILD_DATE}"
          mkdir -p bin dist
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/backlog.exe ./cmd/backlog
          (cd bin && 7z a "../dist/backlog-${TAG}-windows-amd64.zip" backlog.exe)

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*
          retention-days: 1

  build-freebsd:
    name: Build FreeBSD amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build FreeBSD binary in VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y go git gcc pkgconf xorg libglvnd
          run: |
            TAG="${{ github.ref_name || inputs.tag_name }}"
            COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
            BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            LDFLAGS="-s -w -X github.com/altenwald/backlog/pkg/version.Version=${TAG} -X github.com/altenwald/backlog/pkg/version.GitCommit=${COMMIT} -X github.com/altenwald/backlog/pkg/version.BuildDate=${BUILD_DATE}"
            mkdir -p bin dist
            git config --global --add safe.directory "$PWD" || true
            CGO_ENABLED=1 go build -buildvcs=false -ldflags="${LDFLAGS}" -o bin/backlog ./cmd/backlog
            tar -czvf "dist/backlog-${TAG}-freebsd-amd64.tar.gz" -C bin backlog

      - name: Upload FreeBSD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-artifacts
          path: dist/*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-windows, build-freebsd]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract Tag Message & Generate Checksums
        id: prep
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          git fetch --tags --force
          
          # Extract the annotated tag body or subject
          TAG_MSG=$(git tag -l --format='%(contents)' "${TAG}")
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG=$(git tag -l --format='%(subject)' "${TAG}")
          fi
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG="Release ${TAG}"
          fi

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$TAG_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Generate SHA256 checksums
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name || inputs.tag_name }}
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          body: ${{ env.RELEASE_NOTES }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
